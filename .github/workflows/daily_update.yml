name: Daily live-citations refresh

on:
  schedule:
    - cron: "0 10 * * *"   # 06:00 America/New_York during EDT (05:00 during EST)
  workflow_dispatch:

permissions:
  contents: write          # needed only to commit data/live.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: pip install --require-hashes -r scripts/requirements.txt

      - name: Fetch citations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_live.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && echo "No change." || git commit -m "chore: refresh live citations"
          git push
